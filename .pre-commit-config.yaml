repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix --show-fixes
        language: system
        pass_filenames: true
        files: ^.*\.py$
        always_run: false
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        pass_filenames: true
        files: ^.*\.py$
        always_run: false
      - id: pyright
        name: pyright
        entry: pyright
        language: system
        always_run: false
        pass_filenames: true
        files: ^(?!scripts/).*\.py$
      - id: pyright_scripts
        name: pyright scripts
        entry: pyright --pythonversion 3.10
        language: system
        always_run: false
        pass_filenames: true
        files: ^scripts/.*\.py$
      - id: generate passthrough modules
        name: generate passthrough modules
        entry: python scripts/generate_version_submodule_imports.py generate
        language: system
        always_run: true
        pass_filenames: false
      - id: generate json schemas
        name: generate json schemas
        entry: python scripts/generate_json_schema.py
        language: system
        always_run: true
        pass_filenames: false
      - id: generate spec md docs
        name: generate spec md docs
        entry: python scripts/generate_spec_documentation.py
        language: system
        always_run: true
        pass_filenames: false
