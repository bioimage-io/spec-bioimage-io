%YAML 1.2
---
name: UNet 2D Nuclei Broad
description: A 2d U-Net trained on the nuclei broad dataset.
covers:
  - source: cover0.png
authors:
  - affiliation: EMBL Heidelberg
    orcid: 0000-0001-6562-7187
    name: Constantin Pape;@bioimage-io
  - affiliation: EMBL Heidelberg
    orcid: 0000-0002-8567-6389
    name: Fynn Beuttenmueller
cite:
  - text:
      'Ronneberger, Olaf et al. U-net: Convolutional networks for biomedical image segmentation.
      MICCAI 2015.'
    doi: 10.1007/978-3-319-24574-4_28
  - text: 2018 Data Science Bowl
    url: https://example.com/
license: MIT
git_repo: https://github.com/bioimage-io/spec-bioimage-io/tree/main/example_descriptions/models/unet2d_nuclei_broad
maintainers:
  - name: Constantin Pape
    github_user: constantinpape
  - name: Fynn Beuttenmueller
    github_user: fynnbe
tags:
  - unet2d
  - pytorch
  - nucleus
  - segmentation
  - dsb2018
format_version: 0.5.15
type: model
documentation:
  source: README.md
inputs:
  - id: raw
    description: raw input
    axes:
      - type: batch
        size: 1
      - type: channel
        channel_names:
          - raw_intensity
      - size: { min: 144, step: 16 }
        id: y
        type: space
        concatenable: reproducible
      - size: { min: 144, step: 16 }
        type: space
        concatenable: reproducible
    test_tensor:
      source: test_input.npy
      sha256: 92768a2e0f2643c80b57afa5494019a5aafe5b0d92fe36ae740763adf3594a57
    sample_tensor:
      source: test_input.png
      sha256: 8771f558305dd89f4a85fe659e8ef5e116c94d64e668dc23b9282fda3fe9cce8
    preprocessing:
      - id: ensure_dtype
        kwargs:
          dtype: float32
      - id: zero_mean_unit_variance
        kwargs:
          axes:
            - x
            - y
      - id: ensure_dtype
        kwargs:
          dtype: float32
outputs:
  - id: probability
    description: probability in [0,1]
    axes:
      - type: batch
      - type: channel
        channel_names:
          - probability
      - halo: 64
        size:
          tensor_id: raw
          axis_id: y
        id: y
        type: space
      - halo: 64
        size:
          tensor_id: raw
          axis_id: x
        type: space
    test_tensor:
      source: test_output.npy
      sha256: 39925fb38bc74530902e44bf8e43a8bd0a9e3675aab758d89f47dc66cb9818ed
    sample_tensor:
      source: test_output.png
      sha256: 7bce8b53bcd0a12487a61f953aafe0f3700652848980d1083964c5bcb9555eec
    data:
      range:
        - 0.0
        - 1.0
    postprocessing:
      - id: sigmoid
      - id: ensure_dtype
        kwargs:
          dtype: float32
timestamp: '2019-12-11T11:22:32+00:00'
training_data:
  id: ilastik/covid_if_training_data/1
weights:
  onnx:
    source: weights.onnx
    sha256: 9f85ce3b6330f72f1eb0fa99e4a53e0da274e439dd92bdda5d155d0ac660bd9d
    parent: pytorch_state_dict
    comment: Converted with bioimageio.core 0.12.0, dynamo=True.
    opset_version: 18
    external_data:
      source: weights.onnx.data
      sha256: d52d021ebc8aa5bc14d78218ba38e3ba3338a5a0330e134402d34fe125635b5b
  pytorch_state_dict:
    source: http://files.ilastik.org/bioimageio_test/unet2d_nuclei_broad_weights.torch
    sha256: e4d3885bccbe41cbf6c1d825f3cd2b707c7021ead5593156007e407a16b27cf2
    authors:
      - affiliation: EMBL Heidelberg
        orcid: 0000-0001-6562-7187
        name: Constantin Pape;@bioimage-io
    architecture:
      source: unet2d.py
      sha256: 68e34520084afde3b160b8774a863ccf2934169838217ace376d6a244c53422b
      callable: UNet2d
      kwargs:
        input_channels: 1
        output_channels: 1
    pytorch_version: 1.5.1
    dependencies:
      source: environment.yaml
      sha256: 129d589d2ec801398719b1a6d1bf20ea36b3632f14ccb56a24700df7d719fd10
  torchscript:
    source: weights.pt
    sha256: a4b0659a1b48454588b12179855ad0a0c9b69ccaa89b8bb06e6271e8f60b02fe
    parent: pytorch_state_dict
    comment: Converted with bioimageio.core 0.7.0 with use_tracing=False.
    pytorch_version: 2.5.1
config:
  bioimageio:
    reproducibility_tolerance:
      - absolute_tolerance: 5e-3
        relative_tolerance: 5e-3
        mismatched_elements_per_million: 100
        weights_formats: [onnx]
      - absolute_tolerance: 1e-3
        relative_tolerance: 1e-3
        mismatched_elements_per_million: 100
